name: Responsividade e fluidez

# Fora do caminho da publicação, de propósito.
#
# Enquanto o Pages estiver configurado para publicar também a partir do
# branch, existe uma janela em que o site serve o index.html de origem —
# que aponta para /src/app.js e não abre. Essa janela dura o tempo do CI.
# A suíte leva ~25 min; pendurada no deploy, ela mantinha o site quebrado
# por todo esse tempo a cada push.
#
# Aqui ela roda em pull request, sob demanda e uma vez por semana, sem
# atrasar nem bloquear a publicação.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # segunda-feira, 6h UTC

permissions:
  contents: read

jobs:
  responsivo:
    name: 17 telas × 9 tamanhos × 2 temas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Instalar o navegador
        run: npx playwright install --with-deps chromium

      # AINDA NÃO REPROVA. A suíte falha hoje por uma decisão de projeto em
      # aberto — alvo de toque de 44px e fonte de 12px no celular contra a
      # densidade da linguagem macOS — e não por regressão. Quando a
      # contagem zerar, tire o continue-on-error.
      - name: Percorrer a matriz
        run: npm run test:responsivo
        continue-on-error: true

      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-responsivo
          path: |
            docs/relatorio-responsivo.html
            docs/relatorio-responsivo/
          retention-days: 14
